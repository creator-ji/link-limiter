# Префикс отображаемой короткой ссылки
short.link.prefix=clck.ru/

# Время жизни ссылки в часах (задаётся системой, не пользователем)
link.lifetime.hours=24

# Интервал фоновой очистки просроченных ссылок в минутах
cleanup.interval.minutes=1

# Длина генерируемого короткого кода
short.code.length=6

# Допустимый диапазон лимита переходов, который задаёт пользователь
click.limit.min=1
click.limit.max=1000000
